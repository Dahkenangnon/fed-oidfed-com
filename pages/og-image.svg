<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="fed-oidfed-com — six live OpenID Federation 1.0 topologies">
	<title>fed-oidfed-com — six live OpenID Federation 1.0 topologies</title>
	<desc>OpenID Federation 1.0 trust chain: a Trust Anchor at the root resolves down through two Intermediate Authorities to four leaf entities (OpenID Providers and Relying Parties), illustrating one of six topologies served at *.fed.oidfed.com.</desc>

	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1220" />
			<stop offset="100%" stop-color="#001a33" />
		</linearGradient>
		<linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#4da6ff" stop-opacity="0.9" />
			<stop offset="100%" stop-color="#007acc" stop-opacity="0.4" />
		</linearGradient>
		<radialGradient id="taGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#007acc" stop-opacity="0.55" />
			<stop offset="100%" stop-color="#007acc" stop-opacity="0" />
		</radialGradient>
	</defs>

	<!-- Background -->
	<rect width="1200" height="630" fill="url(#bg)" />

	<!-- Subtle dot grid -->
	<g fill="#4da6ff" opacity="0.07">
		<circle cx="60" cy="60" r="1.5" />
		<circle cx="120" cy="60" r="1.5" />
		<circle cx="180" cy="60" r="1.5" />
		<circle cx="240" cy="60" r="1.5" />
		<circle cx="60" cy="120" r="1.5" />
		<circle cx="120" cy="120" r="1.5" />
		<circle cx="180" cy="120" r="1.5" />
		<circle cx="60" cy="180" r="1.5" />
		<circle cx="120" cy="180" r="1.5" />
		<circle cx="1140" cy="60" r="1.5" />
		<circle cx="1140" cy="120" r="1.5" />
		<circle cx="1080" cy="60" r="1.5" />
		<circle cx="1080" cy="120" r="1.5" />
		<circle cx="60" cy="570" r="1.5" />
		<circle cx="120" cy="570" r="1.5" />
		<circle cx="1140" cy="570" r="1.5" />
		<circle cx="1080" cy="570" r="1.5" />
	</g>

	<!-- Left: text -->
	<g font-family="Inter, system-ui, sans-serif" fill="#f4f4f5">
		<!-- Eyebrow -->
		<text x="80" y="120" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="3" fill="#4da6ff" opacity="0.85">DEMO FEDERATION · LIVE</text>

		<!-- Title -->
		<text x="80" y="220" font-size="68" font-weight="700" letter-spacing="-1.5">
			<tspan>fed-oidfed-com</tspan>
		</text>

		<!-- Subtitle, two lines -->
		<text x="80" y="290" font-size="42" font-weight="600" letter-spacing="-0.6" opacity="0.95">
			<tspan>Six OpenID Federation 1.0</tspan>
		</text>
		<text x="80" y="340" font-size="42" font-weight="600" letter-spacing="-0.6">
			<tspan fill="#4da6ff">topologies, live.</tspan>
		</text>

		<!-- Tagline -->
		<text x="80" y="410" font-size="22" opacity="0.7">
			<tspan>Inspect with explore.oidfed.com or @oidfed/cli</tspan>
		</text>

		<!-- Pills row -->
		<g font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5">
			<g transform="translate(80 470)">
				<rect width="178" height="40" rx="20" fill="#007acc" />
				<text x="89" y="26" text-anchor="middle" fill="#ffffff" font-weight="600">SINGLE-ANCHOR</text>
			</g>
			<g transform="translate(270 470)">
				<rect width="158" height="40" rx="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.7" />
				<text x="79" y="26" text-anchor="middle" fill="#4da6ff" opacity="0.85" font-weight="600">HIERARCHICAL</text>
			</g>
			<g transform="translate(440 470)">
				<rect width="172" height="40" rx="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.7" />
				<text x="86" y="26" text-anchor="middle" fill="#4da6ff" opacity="0.85" font-weight="600">MULTI-ANCHOR</text>
			</g>
		</g>
		<g font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5">
			<g transform="translate(80 525)">
				<rect width="208" height="40" rx="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.7" />
				<text x="104" y="26" text-anchor="middle" fill="#4da6ff" opacity="0.85" font-weight="600">CROSS-FEDERATION</text>
			</g>
			<g transform="translate(300 525)">
				<rect width="138" height="40" rx="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.7" />
				<text x="69" y="26" text-anchor="middle" fill="#4da6ff" opacity="0.85" font-weight="600">CONSTRAINED</text>
			</g>
			<g transform="translate(450 525)">
				<rect width="190" height="40" rx="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.7" />
				<text x="95" y="26" text-anchor="middle" fill="#4da6ff" opacity="0.85" font-weight="600">POLICY-OPERATORS</text>
			</g>
		</g>

		<!-- Footer line -->
		<text x="80" y="600" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#a0a0a0">*.fed.oidfed.com</text>
	</g>

	<!-- Right: federation graph -->
	<g transform="translate(870 80)">
		<!-- TA glow -->
		<circle cx="135" cy="100" r="60" fill="url(#taGlow)" />

		<!-- Edges TA → IAs -->
		<g fill="none" stroke="url(#edge)" stroke-width="2">
			<path d="M 135 100 C 135 160, 60 175, 60 220" />
			<path d="M 135 100 C 135 160, 210 175, 210 220" />
			<path d="M 60 240 C 60 290, 30 320, 30 380" />
			<path d="M 60 240 C 60 290, 90 320, 90 380" />
			<path d="M 210 240 C 210 290, 180 320, 180 380" />
			<path d="M 210 240 C 210 290, 240 320, 240 380" />
		</g>

		<!-- Trust Anchor -->
		<circle cx="135" cy="100" r="22" fill="#007acc" />
		<circle cx="135" cy="100" r="22" fill="none" stroke="#80bfff" stroke-width="2" opacity="0.6" />
		<text x="135" y="60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2.5" fill="#80bfff" opacity="0.85">TRUST ANCHOR</text>

		<!-- Intermediates -->
		<g>
			<circle cx="60" cy="230" r="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="60" cy="230" r="14" fill="#007acc" />
			<text x="60" y="275" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.75">INTERMEDIATE</text>
		</g>
		<g>
			<circle cx="210" cy="230" r="20" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="210" cy="230" r="14" fill="#007acc" />
			<text x="210" y="275" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.75">INTERMEDIATE</text>
		</g>

		<!-- Leaves -->
		<g>
			<circle cx="30" cy="395" r="15" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="30" cy="395" r="10" fill="#007acc" />
			<text x="30" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.7">OP</text>
		</g>
		<g>
			<circle cx="90" cy="395" r="15" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="90" cy="395" r="10" fill="#007acc" />
			<text x="90" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.7">RP</text>
		</g>
		<g>
			<circle cx="180" cy="395" r="15" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="180" cy="395" r="10" fill="#007acc" />
			<text x="180" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.7">OP</text>
		</g>
		<g>
			<circle cx="240" cy="395" r="15" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.5" />
			<circle cx="240" cy="395" r="10" fill="#007acc" />
			<text x="240" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#80bfff" opacity="0.7">RP</text>
		</g>
	</g>
</svg>
